name: ui-compose-record

# Re-records the Roborazzi goldens on ubuntu (the platform of record) and uploads them as an artifact.
# Run from the Actions tab (or `gh workflow run ui-compose-record.yml --ref <branch>`); it is only listed once
# this file is on the default branch. Download with `gh run download <id> -n roborazzi-goldens`.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/ui-compose

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :kit:recordRoborazziJvm
      - uses: actions/upload-artifact@v4
        with:
          name: roborazzi-goldens
          path: packages/ui-compose/kit/screenshots
