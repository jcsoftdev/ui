name: site

# On every push to main: builds and pushes the site image to GHCR, then asks Dokploy to redeploy
# the compose service (which only pulls; the VPS never builds). DOKPLOY_SITE_WEBHOOK is a repository
# secret; an empty one is skipped with a warning. Turn off Dokploy's own "Auto Deploy" on that service.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push site
        uses: docker/build-push-action@v6
        with:
          context: .
          file: site/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            SITE_URL=https://ui.jcsoftdev.com
            PUBLIC_STORYBOOK_URL=/storybook/
          tags: |
            ghcr.io/jcsoftdev/ui-site:main
            ghcr.io/jcsoftdev/ui-site:sha-${{ github.sha }}
          cache-from: type=gha,scope=ui-site
          cache-to: type=gha,mode=max,scope=ui-site

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Dokploy deploy
        env:
          SITE_HOOK: ${{ secrets.DOKPLOY_SITE_WEBHOOK }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$SITE_HOOK" ]; then
            echo "::warning::DOKPLOY_SITE_WEBHOOK secret is empty, skipping site deploy"
            exit 0
          fi
          # Dokploy's compose webhook reads a GitHub push payload: without the event header and
          # ref it answers 301 "Branch Not Match" and deploys nothing.
          body=$(printf '{"ref":"refs/heads/main","after":"%s","head_commit":{"id":"%s","message":"deploy %s"},"commits":[]}' "$COMMIT_SHA" "$COMMIT_SHA" "$COMMIT_SHA")
          code=$(curl --silent --show-error --max-time 30 -o response.json -w '%{http_code}' -X POST "$SITE_HOOK" \
            -H 'Content-Type: application/json' -H 'X-GitHub-Event: push' -d "$body")
          cat response.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::Dokploy site webhook answered $code"
            exit 1
          fi
