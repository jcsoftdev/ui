name: ui-compose

on:
  push:
    paths:
      - "packages/ui-compose/**"
      - "packages/ui-tokens/tokens/**"
      - "packages/ui-tokens/scripts/build-theme.mjs"
      - "packages/ui-tokens/bin/ui-theme.mjs"
      - "packages/ui/icons/**"
      - ".github/workflows/ui-compose.yml"
  pull_request:
    paths:
      - "packages/ui-compose/**"
      - "packages/ui-tokens/tokens/**"
      - "packages/ui-tokens/scripts/build-theme.mjs"
      - "packages/ui-tokens/bin/ui-theme.mjs"
      - "packages/ui/icons/**"
      - ".github/workflows/ui-compose.yml"

concurrency:
  group: ui-compose-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/ui-compose

jobs:
  # Linux covers everything except the Apple targets and costs a tenth of a macOS minute.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
      # verifyRoborazziJvm re-runs the screenshot tests against the committed goldens in kit/screenshots.
      - run: ./gradlew spotlessCheck apiCheck :kit:allTests :kit:verifyRoborazziJvm :kit:assembleRelease :sample:assembleRelease
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: roborazzi-diffs
          path: packages/ui-compose/kit/build/outputs/roborazzi
          if-no-files-found: ignore

  # Kotlin/Native iOS compilation needs Xcode, so it gets its own macOS job limited to the compile task.
  ios-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :kit:compileKotlinIosSimulatorArm64
