name: ui-compose

on:
  push:
    paths:
      - "packages/ui-compose/**"
      - ".github/workflows/ui-compose.yml"
  pull_request:
    paths:
      - "packages/ui-compose/**"
      - ".github/workflows/ui-compose.yml"

concurrency:
  group: ui-compose-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/ui-compose

jobs:
  # Linux covers everything except the Apple targets and costs a tenth of a macOS minute.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew spotlessCheck apiCheck :kit:allTests :kit:assembleRelease :sample:assembleRelease

  # Kotlin/Native iOS compilation needs Xcode, so it gets its own macOS job limited to the compile task.
  ios-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :kit:compileKotlinIosSimulatorArm64
