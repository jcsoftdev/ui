name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # The repo is public: a fork pull request must never run on the self-hosted Mac. Same-repo
    # pushes and pull requests use the local runner (label `ui`); everything else stays hosted.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","ui"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Typecheck (the site resolves the built library)
        run: pnpm typecheck
      - run: pnpm check:treeshake
      - run: pnpm check:dist-imports
      - run: pnpm check:docs-examples
      - run: pnpm check:size
      - run: pnpm check:pack
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./packages/ui/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright Chromium
        run: pnpm --filter @jcsoftdev/ui exec playwright install --with-deps chromium
      - name: Storybook stories as browser tests
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"
        run: pnpm --filter @jcsoftdev/ui test:stories
      - name: Theme builder playground in Chromium
        run: pnpm --filter @jcsoftdev/example-vanilla-theme test:e2e
      - name: Build site
        run: pnpm build:site
