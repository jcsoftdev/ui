# Static server for the Astro build. Listens on 8080 so the container runs as a non-root user.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/markdown text/plain text/css application/javascript application/json image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/markdown text/css application/javascript application/json image/svg+xml;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-hashed assets never change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Every docs page also exists as Markdown. `types {}` clears the extension map so default_type wins.
    location ~ \.md$ {
        types {}
        default_type text/markdown;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~ ^/(llms\.txt|llms-full\.txt)$ {
        types {}
        default_type text/plain;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
}
